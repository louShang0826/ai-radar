quick:
  - '<strong>海外大厂：2026 年 5–10 月，五家都推出了"常驻云端的个人 Agent"</strong>：Google Gemini Spark（05-19）、Meta Muse（09-08）、Anthropic Claude（Cowork 并入所有对话，09-16）、Microsoft Copilot Autopilot（09-25，私测）、OpenAI Dots（09-29）；Apple Siri AI 和 Amazon Alexa+ 走设备或系统助手路线，作为参照。'
  - '<strong>形态已经趋同，初创是先行者</strong>：一人一机、常驻、主动、IM 或短信入口、敏感操作需审批，这套形态是 OpenClaw、Poke、Lindy、Genspark、Instinct 先跑出来的，大厂在 2026 年 9 月集中跟进（Muse 公开承认"深受 OpenClaw 启发"）。'
  - '<strong>Muse 和 Dots 上线后，初创公司开始被正面挤压</strong>：Poke 被 Cognition 收购（07 月），The Browser Company 被 Atlassian 收购（Dia 转向工作场景）；Instinct 在 Muse 之后仍拿到 100 亿美元估值（09-28 C 轮融资 10 亿美元）。'
  - '<strong>初创的护城河要么是"入口和体验"，要么是"开放性"</strong>：Poke 和 Instinct 没有 App，只用短信，人格化强；OpenClaw、Hermes、Rabbit OS3 支持自带模型（BYOK）、可以接入第三方 Agent、能控制多台设备；被收购或转向（Poke、Dia、Lindy 转企业）将是常态。'
  - '<strong>国内的瓶颈是生态墙，不是模型</strong>：大厂多在内测、灰度或传闻阶段（Handy Bot 已被官方否认，QClaw 将于 12-24 停运）；初创主要有两条路线，模型公司的"托管龙虾"（MiniMax MaxClaw、Kimi）和系统或终端路线（智谱 AutoGLM、阶跃 Amoo、Today AI），国内还没有一家初创做出 Instinct 或 Poke 那样的爆款消费级个人 Agent。'
  - '<strong>初创盘点</strong>：共盘点 26 个候选，纳入 14 个（其中 12 个写卡片，2 个归入相关卡片），排除 12 个。'
  - '<strong>商业模式还没跑通</strong>：大厂是免费加抽成（Meta）、订阅加用量（OpenAI、Microsoft、Anthropic、Google）、硬件或会员捆绑；初创是订阅加积分、单独收云电脑月费（Genspark、Manus），或暂时免费（Instinct）；每用户的算力成本是共同难题。'
