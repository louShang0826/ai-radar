quick:
- <strong>Harness 放在沙箱外、凭证不进沙箱</strong>已是头部厂商共识：Anthropic Managed Agents 把会话、harness、沙箱拆成三层；Codex Cloud 的 secrets 只在 setup 阶段可见。
- <strong>人工逐条审批不可靠</strong>：权限弹窗批准率约 93%，Claude Code auto mode 与 Codex <code>auto_review</code> 把审批交给模型；真正兜底的仍是出网控制和文件边界。
- <strong>画布路线在收缩</strong>：OpenAI Agent Builder 已宣布弃用、2026-11-30 关停，Zapier 把独立 Agents 并回 Zap，画布正退化为“确定性骨架”。
- <strong>单任务成本的大头是模型 token</strong>：约 50 步的任务模型费约 1–2 美元，沙箱只要几美分，KV-cache 命中率是最重要的成本指标。
- <strong>个人 Agent 已是海外头部厂商的标配，而且形态一致</strong>：OpenAI Dots、Google Gemini Spark、Meta Muse、Instinct、Cue 都是“一个 Agent 一台云电脑 + 常驻 + 主动 + IM/协作工具入口 + 审批”；成本上分“常驻 VM（Muse）”与“按需恢复 microVM（ChatGPT Work）”两条路线。
- <strong>“Agent 如何向第三方网站表明身份”成为新的主战场</strong>：9-20 起亚马逊封禁 Muse 代用户购物；10-06 Meta 与 Sierra 发布开放协议 Personal Agent Protocol（Poppy）；10-07 微软发布 MXC 执行容器 GA，并预告用 Entra 区分 Agent 和人的操作。
- <strong>国内进入“政策加治理”阶段</strong>：截至 2026-08-31 已有 1112 款生成式 AI 服务备案；IDC 调研显示智能体企业渗透率仅 18%，62% 的企业把数据权限与安全合规列为首要障碍。10 月有两处更新：<strong>腾讯 Handy Bot 已被腾讯混元官方否认</strong>，服务号已注销；腾讯 QClaw 宣布 12-24 停止服务、并入 WorkBuddy【二手】。
